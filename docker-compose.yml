services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cactus-app
    container_name: cactus-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - cactus-network
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
      - "80:8000"
      - "5173:5173"

networks:
  cactus-network:
    driver: bridge
