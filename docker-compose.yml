version: '3.8'
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: cactus-app
    container_name: cactus-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - cactus-network
    depends_on:
      - db
    env_file:
      - .env
    command: php artisan serve --host=0.0.0.0 --port=8000
    ports:
      - "8000:8000"
      - "80:8000"
      - "5173:5173"

  db:
    image: mysql:8.0
    container_name: cactus-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_USER: ${DB_USERNAME}
      SERVICE_TAGS: dev
      SERVICE_NAME: mysql
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - cactus-network
    ports:
      - "3306:3306"

networks:
  cactus-network:
    driver: bridge

volumes:
  dbdata:
    driver: local
